name: Docker image

# 仅手动：Actions → Docker image → Run workflow（不随提交自动推送）
on:
  workflow_dispatch:
    inputs:
      push:
        description: 'Push to ghcr.io'
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read package version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # 日活密钥只经 Actions Secrets 打进镜像内 .env，不进公开源码
      - name: Inject DAU env for Docker image
        env:
          LEMON_DAU_URL: ${{ secrets.LEMON_DAU_URL }}
          LEMON_DAU_TOKEN: ${{ secrets.LEMON_DAU_TOKEN }}
        run: |
          if [ -z "$LEMON_DAU_URL" ] || [ -z "$LEMON_DAU_TOKEN" ]; then
            echo "缺少 Secrets LEMON_DAU_URL / LEMON_DAU_TOKEN，镜像将无法上报日活" >&2
            exit 1
          fi
          printf 'LEMON_DAU_URL=%s\nLEMON_DAU_TOKEN=%s\n' "$LEMON_DAU_URL" "$LEMON_DAU_TOKEN" > dau.release.env
          chmod 600 dau.release.env
          echo "DAU env written to dau.release.env for image build"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.ver.outputs.version }}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ inputs.push }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
