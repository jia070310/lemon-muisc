name: Build FPK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fpk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install fnpack
        run: |
          curl -fsSL "https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64" -o fnpack
          echo "54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93  fnpack" | sha256sum -c -
          chmod +x fnpack
          sudo mv fnpack /usr/local/bin/fnpack

      - name: Build FPK
        run: |
          find fpk/cmd -type f -exec chmod +x {} +
          find fpk/cmd -type f -exec sed -i 's/\r$//' {} +
          fnpack build --directory fpk
          FPK="$(find . -type f -name '*.fpk' | head -n 1)"
          echo "found: ${FPK}"
          test -n "$FPK"
          mv "$FPK" lemon-music-1.0.0.fpk
          ls -lh lemon-music-1.0.0.fpk

      - name: Upload FPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lemon-music-fpk
          path: lemon-music-1.0.0.fpk
          if-no-files-found: error

      - name: Attach FPK to GitHub Release v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view v1.0.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create v1.0.0 --title "v1.0.0" --notes "Test build" --repo "${{ github.repository }}"
          fi
          gh release upload v1.0.0 lemon-music-1.0.0.fpk --clobber --repo "${{ github.repository }}"
