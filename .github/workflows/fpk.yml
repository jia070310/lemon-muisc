name: Build FPK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fpk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install fnpack
        run: |
          curl -fsSL "https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64" -o fnpack
          echo "54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93  fnpack" | sha256sum -c -
          chmod +x fnpack
          sudo mv fnpack /usr/local/bin/fnpack

      - name: Build FPK
        id: build
        run: |
          VERSION="$(awk -F= '/^version/{gsub(/ /,"",$2); print $2; exit}' fpk/manifest)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building FPK for version ${VERSION}"
          find fpk/cmd -type f -exec chmod +x {} +
          find fpk/cmd -type f -exec sed -i 's/\r$//' {} +
          fnpack build --directory fpk
          FPK="$(find . -type f -name '*.fpk' | head -n 1)"
          echo "found: ${FPK}"
          test -n "$FPK"
          mv "$FPK" "lemon-music-${VERSION}.fpk"
          ls -lh "lemon-music-${VERSION}.fpk"

      - name: Upload FPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lemon-music-fpk
          path: lemon-music-${{ steps.build.outputs.version }}.fpk
          if-no-files-found: error

      - name: Attach FPK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.build.outputs.version }}"
          TAG="v${VERSION}"
          FPK="lemon-music-${VERSION}.fpk"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if [ -f docs/RELEASE-NOTES.md ]; then
              gh release create "$TAG" --title "$TAG" --notes-file docs/RELEASE-NOTES.md --repo "${{ github.repository }}"
            else
              gh release create "$TAG" --title "$TAG" --notes "Release ${TAG}" --repo "${{ github.repository }}"
            fi
          fi
          gh release upload "$TAG" "$FPK" --clobber --repo "${{ github.repository }}"
