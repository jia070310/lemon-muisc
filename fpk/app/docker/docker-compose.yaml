services:
  lemon-music:
    image: ghcr.1ms.run/jia070310/lemon-muisc:latest
    container_name: lemon-music
    restart: unless-stopped
    ports:
      - "7983:7983"
    volumes:
      - "${TRIM_PKGVAR}/music:/music"
      - "${TRIM_PKGVAR}/downloads:/downloads"
      - "${TRIM_PKGVAR}/config:/config"
    environment:
      PORT: 7983
      DOWNLOAD_PATH: /music
      CONFIG_PATH: /config
