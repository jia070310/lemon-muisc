services:
  lemon-music:
    # 必须用完整仓库地址；短名 lemon-music 会被飞牛当成 Docker Hub 拉取并超时
    image: ghcr.1ms.run/jia070310/lemon-muisc:latest
    container_name: lemon-music
    # fnOS 关机时会 docker stop 全部容器，unless-stopped 开机不会自启；always 可恢复
    restart: always
    ports:
      - "7983:7983"
    volumes:
      - "${TRIM_PKGVAR}/music:/music"
      - "${TRIM_PKGVAR}/downloads:/downloads"
      - "${TRIM_PKGVAR}/config:/config"
    environment:
      PORT: "7983"
      DOWNLOAD_PATH: /music
      CONFIG_PATH: /config
