services:
  lemon-music:
    image: ghcr.io/jia070310/lemon-muisc:latest
    container_name: lemon-music
    restart: unless-stopped
    ports:
      - "7983:7983"
    volumes:
      - "/var/apps/lemon-music/shares/lemon-music/data:/music"
      - "/var/apps/lemon-music/shares/lemon-music/downloads:/downloads"
      - "/var/apps/lemon-music/shares/lemon-music/config:/config"
    environment:
      - PORT=7983
      - DOWNLOAD_PATH=/music
      - CONFIG_PATH=/config
