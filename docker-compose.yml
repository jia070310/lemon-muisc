services:
  lemon-music:
    image: ghcr.io/jia070310/lemon-muisc:latest
    build: .
    container_name: lemon-music
    ports:
      - "7983:7983"
    volumes:
      # 请改成你的音乐目录和配置目录
      - ./data:/data
      - ./config:/config
    environment:
      - PORT=7983
      - DOWNLOAD_PATH=/data
      - CONFIG_PATH=/config
    restart: unless-stopped
