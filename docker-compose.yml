version: "3"
services:
  lemon-music:
    image: ghcr.io/jia070310/lemon-muisc:latest
    ports:
      - "7983:7983"
    restart: unless-stopped
    environment:
      PORT: 7983
      DOWNLOAD_PATH: /music
      CONFIG_PATH: /config
    volumes:
      - "~/Music/data:/music"
      - "~/Music/config:/config"
